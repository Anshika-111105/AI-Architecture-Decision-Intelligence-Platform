version: "1.0"
project: "ADIP"
phase: "Phase 3 - Data Strategy & Dataset Creation"
lead: "Anshika"


# 1. Storage Paths & Directory Layout
# Principle: "Don't Combine Immediately" — keep raw data completely untouched.
storage:
  base_dir: "ml/data"
  raw_dir: "ml/data/raw"
  interim_dir: "ml/data/interim"
  processed_dir: "ml/data/processed"
  external_dir: "ml/data/external"
  artifacts_dir: "ml/artifacts"
  reports_dir: "ml/reports"


# 2. Provenance Schema Requirements
# Every ingested record must carry this metadata to maintain scientific auditability.
# Synthetic/simulated data is strictly tracked and never labeled as real observation.

provenance_schema:
  mandatory_fields:
    - source_id               # e.g., "src_01_zenodo"
    - source_name             # Human-readable name
    - evidence_type           # Type A, Type B, Type C, Type D, Type E
    - is_real                 # bool: real observed operational traffic
    - is_benchmark            # bool: controlled repeatable benchmark testbed
    - is_simulated            # bool: generated by SimPy/analytical simulator
    - is_synthetic            # bool: synthetic generator (e.g., LLM/graph generator)
    - collection_timestamp    # ISO-8601 collection timestamp
    - pipeline_version        # Version of cleaner/normalizer script
    - license                 # Open source license & usage terms


# 3. Data Source Inventory (13 Core/Additional + In-House Sources)

data_sources:


  # Type A: Real Production Traces
  alibaba_cluster_trace:
    id: "src_02_alibaba"
    name: "Alibaba Microservices Cluster Trace (v2021)"
    evidence_type: "Type_A_Production_Trace"
    is_real: true
    is_benchmark: false
    is_simulated: false
    is_synthetic: false
    url: "https://github.com/alibaba/clusterdata/tree/master/cluster-trace-microservices-v2021"
    license: "Research / Non-Commercial Use"
    priority: "High"
    raw_subdir: "02_alibaba"
    description: "Production call graphs, real-world request arrival rates, response times, and node resource metrics across 20,000+ microservices."
    extracted_features:
      - "call_rate_rps"
      - "response_time_ms"
      - "cpu_utilization_ratio"
      - "memory_utilization_ratio"
      - "service_call_depth"


  # Type B: Controlled Benchmark Measurements
  zenodo_microservices:
    id: "src_01_zenodo"
    name: "Zenodo Microservices Benchmark"
    evidence_type: "Type_B_Controlled_Benchmark"
    is_real: false
    is_benchmark: true
    is_simulated: false
    is_synthetic: false
    url: "https://zenodo.org/records/6907619"
    license: "Creative Commons Attribution 4.0 International"
    priority: "High"
    raw_subdir: "01_zenodo"
    description: "Controlled experiments measuring CPU, memory, concurrency levels, and latency distributions for containerized services."
    extracted_features:
      - "concurrency"
      - "cpu_limit"
      - "memory_limit"
      - "latency_p50"
      - "latency_p95"
      - "latency_p99"

  techempower_frameworks:
    id: "src_03_techempower"
    name: "TechEmpower FrameworkBenchmarks"
    evidence_type: "Type_B_Controlled_Benchmark"
    is_real: false
    is_benchmark: true
    is_simulated: false
    is_synthetic: false
    url: "https://github.com/TechEmpower/FrameworkBenchmarks"
    license: "Apache-2.0"
    priority: "High"
    raw_subdir: "03_techempower"
    description: "Comprehensive web framework throughput, JSON serialization, database single/multiple queries, and latency curves."
    extracted_features:
      - "framework"
      - "orm_vs_raw"
      - "throughput_rps"
      - "latency_avg_ms"
      - "concurrency_level"

  barista_benchmarks:
    id: "src_04_barista"
    name: "Barista Microservice Benchmarks"
    evidence_type: "Type_B_Controlled_Benchmark"
    is_real: false
    is_benchmark: true
    is_simulated: false
    is_synthetic: false
    url: "https://github.com/barista-benchmarks/barista"
    license: "MIT"
    priority: "High"
    raw_subdir: "04_barista"
    description: "Serverless and microservice cold-start, warm invocation latency, CPU memory scaling footprints."
    extracted_features:
      - "startup_latency_ms"
      - "warm_latency_ms"
      - "memory_footprint_mb"
      - "cpu_burst"

  ycsb_benchmarks:
    id: "src_07_ycsb"
    name: "Yahoo! Cloud Serving Benchmark (YCSB)"
    evidence_type: "Type_B_Controlled_Benchmark"
    is_real: false
    is_benchmark: true
    is_simulated: false
    is_synthetic: false
    url: "https://github.com/brianfrankcooper/YCSB"
    license: "Apache-2.0"
    priority: "High"
    raw_subdir: "07_ycsb"
    description: "Database workload benchmarks evaluating read vs. write ratios (Workloads A through F) across relational and NoSQL engines."
    extracted_features:
      - "read_write_ratio"
      - "db_latency_read_ms"
      - "db_latency_write_ms"
      - "db_throughput_ops"

  tpc_benchmarks:
    id: "src_08_tpc"
    name: "TPC Benchmarks (TPC-C, TPC-H)"
    evidence_type: "Type_B_Controlled_Benchmark"
    is_real: false
    is_benchmark: true
    is_simulated: false
    is_synthetic: false
    url: "https://www.tpc.org/information/benchmarks5.asp"
    license: "Public Benchmark Reports"
    priority: "Medium"
    raw_subdir: "08_tpc"
    description: "Standardized OLTP (transactional) and OLAP (decision support analytical) performance reports."
    extracted_features:
      - "transactions_per_minute"
      - "acid_overhead_ms"
      - "query_complexity_factor"

  aws_pricing:
    id: "src_09_aws_pricing"
    name: "AWS Price List API & Cloud Pricing Models"
    evidence_type: "Type_B_Controlled_Benchmark"
    is_real: true
    is_benchmark: false
    is_simulated: false
    is_synthetic: false
    url: "https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/Welcome.html"
    license: "AWS Customer Agreement"
    priority: "High"
    raw_subdir: "09_aws_pricing"
    description: "Real-time compute (EC2/Fargate), database (RDS/Aurora/DynamoDB), cache (ElastiCache), and network egress unit pricing."
    extracted_features:
      - "hourly_compute_rate"
      - "hourly_database_rate"
      - "hourly_cache_rate"
      - "data_transfer_gb_rate"

  # Type C: Architecture Specifications & Reference Topologies
  technical_architectures_large:
    id: "src_06_technical_architectures"
    name: "Technical-Architectures-Large"
    evidence_type: "Type_C_Architecture_Specification"
    is_real: false
    is_benchmark: false
    is_simulated: false
    is_synthetic: true
    url: "https://huggingface.co/datasets/ajibawa-2023/Technical-Architectures-Large"
    license: "MIT"
    priority: "High"
    raw_subdir: "06_technical_architectures"
    description: "Machine-readable graph specifications of diverse software architecture topologies, styles, and edge interactions."
    extracted_features:
      - "architecture_pattern"
      - "node_count"
      - "edge_count"
      - "graph_depth"
      - "average_degree"

  deathstarbench:
    id: "src_10_deathstarbench"
    name: "DeathStarBench Open-Source Microservices"
    evidence_type: "Type_C_Architecture_Specification"
    is_real: false
    is_benchmark: true
    is_simulated: false
    is_synthetic: false
    url: "https://github.com/delimitrou/DeathStarBench"
    license: "Apache-2.0"
    priority: "High"
    raw_subdir: "10_deathstarbench"
    description: "End-to-end benchmark topologies including Social Network, Hotel Reservation, and Media Microservices."
    extracted_features:
      - "service_topology"
      - "inter_service_rpc"
      - "cache_integration"

  train_ticket:
    id: "src_11_train_ticket"
    name: "Train-Ticket Microservices Application"
    evidence_type: "Type_C_Architecture_Specification"
    is_real: false
    is_benchmark: true
    is_simulated: false
    is_synthetic: false
    url: "https://github.com/FudanSELab/train-ticket"
    license: "Apache-2.0"
    priority: "High"
    raw_subdir: "11_train_ticket"
    description: "Complex industry-scale microservice benchmark with 40+ microservices, mixed DBs (MySQL, MongoDB), and message queues."
    extracted_features:
      - "complex_dependency_graph"
      - "heterogeneous_db_usage"
      - "event_driven_messaging"

  online_boutique:
    id: "src_13_online_boutique"
    name: "Google Cloud Online Boutique"
    evidence_type: "Type_C_Architecture_Specification"
    is_real: false
    is_benchmark: true
    is_simulated: false
    is_synthetic: false
    url: "https://github.com/GoogleCloudPlatform/microservices-demo"
    license: "Apache-2.0"
    priority: "High"
    raw_subdir: "13_online_boutique"
    description: "Cloud-native 11-tier microservices application communicating via gRPC with Redis cache and Kubernetes deployment."
    extracted_features:
      - "grpc_service_latency"
      - "k8s_resource_requests"
      - "redis_cache_patterns"

  opentelemetry_demo:
    id: "src_12_opentelemetry"
    name: "OpenTelemetry Astronomy Shop Demo"
    evidence_type: "Type_C_Architecture_Specification"
    is_real: false
    is_benchmark: true
    is_simulated: false
    is_synthetic: false
    url: "https://github.com/open-telemetry/opentelemetry-demo"
    license: "Apache-2.0"
    priority: "Medium"
    raw_subdir: "12_opentelemetry"
    description: "Microservice application instrumented with OpenTelemetry distributed traces and span metrics."
    extracted_features:
      - "distributed_trace_spans"
      - "error_propagation"
      - "service_dependencies"


  # Type D: Unstructured Knowledge (For RAG + LLM Grounding, Not Regression)
  software_architecture_text:
    id: "src_05_software_architecture"
    name: "Software-Architecture Q&A / Knowledge Dataset"
    evidence_type: "Type_D_Knowledge_Text"
    is_real: true
    is_benchmark: false
    is_simulated: false
    is_synthetic: false
    url: "https://huggingface.co/datasets/ajibawa-2023/Software-Architecture"
    license: "Apache-2.0"
    priority: "High"
    raw_subdir: "05_software_architecture"
    description: "Architecture rationale, design pattern trade-offs, and failure mode documentation for pgvector RAG ingestion."
    target_layer: "knowledge/rag"


  # Type E: ADIP In-House Generated Experimental & Simulation Data
  adip_controlled_experiments:
    id: "src_14_adip_experiments"
    name: "ADIP Controlled Testbed Experiments"
    evidence_type: "Type_E_ADIP_Generated"
    is_real: false
    is_benchmark: true
    is_simulated: false
    is_synthetic: false
    priority: "Essential"
    local_path: "ml/data/raw/14_adip_experiments"
    description: "Controlled test runs executing Locust/k6 against Docker/K8s testbeds systematically varying DB, Cache, Broker, Replicas."

  adip_simulation_engine:
    id: "src_15_adip_simulation"
    name: "ADIP SimPy Discrete-Event Simulation Data"
    evidence_type: "Type_E_ADIP_Generated"
    is_real: false
    is_benchmark: false
    is_simulated: true
    is_synthetic: false
    priority: "Essential"
    local_path: "ml/data/raw/15_adip_simulation"
    description: "Queuing theory and SimPy simulation runs modeling request arrivals, service rates, queue buffers, and network delays under seeds."


# 4. Ingestion & Validation Guardrails
pipeline_settings:
  raw_retention: true                  # Raw sources are immutable
  clean_interim_on_success: false      # Keep interim files for auditability
  random_seed: 42                      # Global deterministic seed
  split_strategy: "group_by_architecture_id" # Prevent train/test leakage
  test_size: 0.15
  validation_size: 0.15
  train_size: 0.70
