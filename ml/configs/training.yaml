version: "1.0"
project: "ADIP"
module: "Model Training & Hyperparameter Optimization Configuration"
author: "Ananya (ML Optimization & Model Lifecycle Engineer)"
date: "October 2026"

# ==============================================================================
# 1. MLflow Tracking & Lifecycle Configuration
# ==============================================================================
mlflow:
  tracking_uri: "mlruns"
  experiment_name: "ADIP_Surrogate_Optimization"
  artifact_location: "mlruns/artifacts"
  default_tags:
    project: "ADIP"
    engineer: "Ananya"
    environment: "research_and_development"
    phase: "surrogate_modeling_and_tuning"
  registry:
    model_name_prefix: "adip_surrogate"
    stages: ["Staging", "Production", "Archived"]

# ==============================================================================
# 2. Dataset Versioning Protocol
# Every run must log and pin to an immutable dataset snapshot
# ==============================================================================
dataset_versioning:
  active_version: "v1.0_clean"
  approved_versions:
    - version_tag: "v1.0_clean"
      description: "Phase 4 certified clean baseline dataset with zero target leakage."
      path: "ml/data/unified/v1.0_clean.parquet"
      features_spec: "ml/configs/features.yaml"
    - version_tag: "v1.1_augmented"
      description: "Extended dataset incorporating SimPy queueing simulation scenarios."
      path: "ml/data/unified/v1.1_augmented.parquet"
      features_spec: "ml/configs/features.yaml"

# ==============================================================================
# 3. Cross-Validation & Group Splitting
# Rule: Prevent architectural variant leakage across training and validation folds
# ==============================================================================
cross_validation:
  strategy: "GroupKFold"
  group_column: "architecture_id"
  n_splits: 5
  shuffle: false
  random_state: 42

# ==============================================================================
# 4. Preprocessing Pipeline Specification
# ==============================================================================
preprocessing:
  numerical:
    imputation_strategy: "median"
    scaler: "RobustScaler"  # Robust to heavy-tailed latency/cost distributions
  categorical:
    imputation_strategy: "constant"
    fill_value: "none"
    encoder: "OneHotEncoder"
    handle_unknown: "ignore"

# ==============================================================================
# 5. Hyperparameter Search Spaces (GridSearch & Optuna)
# ==============================================================================
hyperparameter_search:
  optimization_frameworks: ["optuna", "grid_search", "random_search"]
  default_framework: "grid_search"

  # GridSearch Discrete Grids
  grid_search_spaces:
    xgboost:
      n_estimators: [50, 100, 200]
      max_depth: [3, 5, 7]
      learning_rate: [0.03, 0.08, 0.15]
      subsample: [0.8, 1.0]
      colsample_bytree: [0.8, 1.0]
      min_child_weight: [1, 3]
      reg_alpha: [0.0, 0.1]
      reg_lambda: [1.0, 3.0]

    gradient_boosting:
      n_estimators: [50, 100, 200]
      max_depth: [3, 5, 7]
      learning_rate: [0.03, 0.08, 0.15]
      subsample: [0.8, 1.0]

    random_forest:
      n_estimators: [50, 100, 200]
      max_depth: [5, 10, 15]
      min_samples_split: [2, 5]
      min_samples_leaf: [1, 2]

  # Optuna Continuous & Discrete Distribution Ranges
  optuna_trials: 40
  optuna_timeout_sec: 600
  optuna_sampler: "TPESampler"
  optuna_search_spaces:
    xgboost:
      n_estimators:
        type: "int"
        low: 50
        high: 350
        step: 25
      max_depth:
        type: "int"
        low: 3
        high: 10
      learning_rate:
        type: "float"
        low: 0.01
        high: 0.25
        log: true
      subsample:
        type: "float"
        low: 0.65
        high: 1.0
      colsample_bytree:
        type: "float"
        low: 0.65
        high: 1.0
      min_child_weight:
        type: "int"
        low: 1
        high: 8
      reg_alpha:
        type: "float"
        low: 1e-4
        high: 5.0
        log: true
      reg_lambda:
        type: "float"
        low: 1e-3
        high: 10.0
        log: true

# ==============================================================================
# 6. Target Model Specifications
# ==============================================================================
targets:
  latency:
    model_name: "latency_surrogate"
    target_column: "p95"
    loss_function: "reg:squarederror"
    evaluation_metric: "rmse"
    target_transform: "log1p"  # Normalizes exponential tail behavior

  throughput:
    model_name: "throughput_surrogate"
    target_column: "throughput"
    loss_function: "reg:squarederror"
    evaluation_metric: "rmse"
    target_transform: "none"

  resources:
    model_name: "resource_surrogate"
    target_column: "cpu_utilization_ratio"
    loss_function: "reg:squarederror"
    evaluation_metric: "mae"
    target_transform: "none"

  cost:
    model_name: "cost_surrogate"
    target_column: "total_monthly_cost"
    loss_function: "reg:squarederror"
    evaluation_metric: "mae"
    target_transform: "log1p"

  reliability:
    model_name: "reliability_surrogate"
    target_column: "error_rate"
    loss_function: "reg:squarederror"
    evaluation_metric: "mae"
    target_transform: "none"
